# TEMPLATE ONLY — every value is a placeholder. Do not commit real values; create the Secret with
#   oc create secret generic gcpe-stack-secrets --from-env-file=<file outside the repository>
# (or a sealed/external secret). Generate TICK_TOKEN, LOCAL_AUTH_SECRET and STACK_EVENT_SECRET
# with `openssl rand -hex 32` (NoD's link secret is derived from STACK_EVENT_SECRET); LOCAL_ADMIN_PASSWORD_HASH with
# `npm run auth:hash-password`. Database URLs: one database per app, see docs/deploy/openshift.md.
apiVersion: v1
kind: Secret
metadata:
  name: gcpe-stack-secrets
type: Opaque
stringData:
  TICK_TOKEN: "<at least 32 random characters>"
  LOCAL_AUTH_SECRET: "<at least 32 random characters>"
  STACK_EVENT_SECRET: "<at least 32 random characters>"
  LOCAL_ADMIN_PASSWORD_HASH: "<scrypt$... from npm run auth:hash-password>"
  CORE_DATABASE_URL: "postgres://<user>:<password>@<host>:5432/<prefix>_core"
  NRMS_DATABASE_URL: "postgres://<user>:<password>@<host>:5432/<prefix>_nrms"
  NEWSAPI_DATABASE_URL: "postgres://<user>:<password>@<host>:5432/<prefix>_news_api"
  SITE_DATABASE_URL: "postgres://<user>:<password>@<host>:5432/<prefix>_site"
  NOD_DATABASE_URL: "postgres://<user>:<password>@<host>:5432/<prefix>_nod"
  DIST_DATABASE_URL: "postgres://<user>:<password>@<host>:5432/<prefix>_distribution"
  # Optional: leave out and the Calendar is not mounted (/calendar answers 503).
  CALENDAR_DATABASE_URL: "postgres://<user>:<password>@<host>:5432/<prefix>_calendar"
  # Optional: SMTP credentials, Entra sign-in (ENTRA_TENANT_ID, CORE_ENTRA_CLIENT_ID,
  # CORE_ENTRA_CLIENT_SECRET, CORE_PUBLIC_BASE_URL, <PREFIX>_AUTH_AUDIENCE), real Flickr keys.
  DIST_SMTP_USER: "<optional>"
  DIST_SMTP_PASS: "<optional>"
