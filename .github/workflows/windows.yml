name: windows
# The platform's target production host is Windows Server + IIS (docs/deploy/windows.md). This
# runs the same type-check and test suite as ci.yml's `test` job, on Windows, against the
# runner's own preinstalled PostgreSQL with pgvector built from source. Separate from ci.yml so a
# Windows-only failure never hides the Linux results; not a required check until it has run green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  PGVECTOR_VERSION: v0.8.7
jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      # The deployed artifact is built on Linux and never checked out on the server, so test the
      # bytes as committed: CRLF conversion would only produce failures the server can't have.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Start the preinstalled PostgreSQL
        run: |
          $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
          if (-not $svc) { throw 'no preinstalled PostgreSQL service on this runner image' }
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service -Name $svc.Name
          & "$env:PGBIN\pg_config.exe" --version
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build and install pgvector ${{ env.PGVECTOR_VERSION }}
        shell: cmd
        run: |
          git clone --depth 1 --branch %PGVECTOR_VERSION% https://github.com/pgvector/pgvector.git "%RUNNER_TEMP%\pgvector"
          cd /d "%RUNNER_TEMP%\pgvector"
          nmake /NOLOGO /F Makefile.win || exit /b 1
          nmake /NOLOGO /F Makefile.win install || exit /b 1
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          # The runner image's documented superuser password for its preinstalled PostgreSQL.
          TEST_DATABASE_ADMIN_URL: postgres://postgres:root@localhost:5432/postgres

  package:
    uses: ./.github/workflows/windows-package.yml

  # Installs the package on a Windows Server 2025 runner exactly as docs/deploy/windows.md tells the
  # developer to (one Install-Gcpe.ps1 run: IIS, ARR, Node, PostgreSQL 17 + pgvector, the service),
  # then checks the site through IIS, a re-run, and the deploy script's rollback.
  # The target servers are Windows Server 2025; 2022 is kept as the previous release.
  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gcpe-windows
          path: drop
      # The DMZ proxy is installed from its own package (no app\ in it), as on a real DMZ server.
      - uses: actions/download-artifact@v4
        with:
          name: gcpe-proxy
          path: drop-proxy
      - name: Remove the runner's own PostgreSQL, so the installer sees a clean server
        run: |
          $svc = Get-Service -Name 'postgresql*' -ErrorAction SilentlyContinue
          foreach ($s in @($svc)) { if ($s) { Stop-Service $s.Name -Force -ErrorAction SilentlyContinue; sc.exe delete $s.Name | Out-Null } }
          Remove-Item -Recurse -Force "$env:ProgramFiles\PostgreSQL" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force 'HKLM:\SOFTWARE\PostgreSQL' -ErrorAction SilentlyContinue
      - name: Extract the package
        run: |
          $zip = Get-ChildItem drop\*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath C:\pkg
          Get-ChildItem C:\pkg\gcpe-windows | Format-Table Name
          $proxyZip = Get-ChildItem drop-proxy\*.zip | Select-Object -First 1
          Expand-Archive $proxyZip.FullName -DestinationPath C:\pkg-proxy
          $proxyFiles = @(Get-ChildItem C:\pkg-proxy\gcpe-proxy -Recurse -File | ForEach-Object { $_.FullName.Substring('C:\pkg-proxy\gcpe-proxy\'.Length) })
          $proxyFiles | ForEach-Object { Write-Host "  proxy package: $_" }
          if (@($proxyFiles | Where-Object { $_ -like 'app\*' }).Count -gt 0) { throw 'the proxy package must not carry the app' }
      - name: Install-Gcpe.ps1 (first install)
        run: |
          $pw = ConvertTo-SecureString 'ci-admin-password-0001' -AsPlainText -Force
          C:\pkg\gcpe-windows\Install-Gcpe.ps1 -HostName gcpe-ci.example.test -SmtpHost 127.0.0.1 -MailFrom noreply@example.test -MailRedirectTo ci@example.test -AdminPassword $pw
      - name: The site works through IIS
        run: |
          $ErrorActionPreference = 'Stop'
          function Check($label, $ok) { if (-not $ok) { throw "FAILED: $label" } else { Write-Host "ok: $label" } }
          $health = curl.exe -k -sS -f https://localhost/stack/health | ConvertFrom-Json
          $health | ConvertTo-Json -Depth 5
          Check 'health ok through IIS' ($health.status -eq 'ok')
          Check 'every app up' (@($health.apps.PSObject.Properties | Where-Object { -not $_.Value }).Count -eq 0)
          Check 'semantic search can use pgvector' ((Get-Content C:\gcpe\logs\install-*.log -Raw) -match 'pgvector: on')
          $hub = curl.exe -k -sS -o NUL -w '%{http_code}' https://localhost/hub/
          Check "staff app served (HTTP $hub)" ($hub -eq '200')
          $redirect = curl.exe -sS -o NUL -w '%{http_code} %{redirect_url}' http://localhost/hub/
          Check "http redirects to https ($redirect)" ($redirect -like '301 https://localhost/hub/*')
          $body = '{"username":"admin","password":"ci-admin-password-0001"}'
          $login = $body | curl.exe -k -sS -o NUL -w '%{http_code}' -c jar.txt -H 'x-gcpe-request: 1' -H 'content-type: application/json' --data-binary '@-' https://localhost/core/auth/login
          Check "admin signs in through IIS (HTTP $login)" ($login -eq '200')
          $orgs = curl.exe -k -sS -o NUL -w '%{http_code}' -b jar.txt -H 'x-gcpe-request: 1' https://localhost/core/api/organizations
          Check "the session cookie works through IIS (HTTP $orgs)" ($orgs -eq '200')
          $account = (Get-CimInstance Win32_Service -Filter "Name='gcpe-stack'").StartName
          Check "service runs as NT SERVICE\gcpe-stack ($account)" ($account -eq 'NT SERVICE\gcpe-stack')
          $direct = Test-NetConnection -ComputerName $env:COMPUTERNAME -Port 3000 -WarningAction SilentlyContinue
          Write-Host "port 3000 from the machine's own name: $($direct.TcpTestSucceeded) (loopback isn't firewalled; the rule blocks other machines)"
      - name: X-Forwarded-For without ports, private folders, PostgreSQL closed, private IIS logs, log retention
        run: |
          $ErrorActionPreference = 'Stop'
          function Check($label, $ok) { if (-not $ok) { throw "FAILED: $label" } else { Write-Host "ok: $label" } }
          foreach ($dir in @('C:\gcpe\data', 'C:\gcpe\service\logs', 'C:\gcpe\logs', 'C:\gcpe\import-reports')) {
            $acl = Get-Acl -LiteralPath $dir
            $who = @($acl.Access | ForEach-Object { $_.IdentityReference.Value } | Sort-Object -Unique)
            Check "$dir inherits nothing and BUILTIN\Users can't read it ($($who -join ', '))" ($acl.AreAccessRulesProtected -and $who -notcontains 'BUILTIN\Users' -and $who -notcontains 'NT AUTHORITY\Authenticated Users')
          }
          Check 'the service may change C:\gcpe\data' (@((Get-Acl C:\gcpe\data).Access | Where-Object { $_.IdentityReference.Value -eq 'NT SERVICE\gcpe-stack' -and $_.FileSystemRights -match 'Modify' }).Count -gt 0)
          Import-Module C:\pkg\gcpe-windows\lib\Gcpe.psm1 -Force
          $pgOpen = @(Get-GcpeInboundAllowRules -Ports @('5432'))
          Check "no firewall rule opens 5432 to other machines ($(($pgOpen | ForEach-Object { $_.DisplayName }) -join ', '))" ($pgOpen.Count -eq 0)
          $appcmd = "$env:windir\System32\inetsrv\appcmd.exe"
          $proxyCfg = (& $appcmd list config -section:system.webServer/proxy) -join "`n"
          Check 'ARR leaves the client port out of X-Forwarded-For' ($proxyCfg -match 'includePortInXForwardedFor="false"')
          foreach ($p in @('api/Subscribe', 'nod/Subscribe', 'subscribe', 'news-subscribe', 'newsletters', 'enewsletters')) {
            $cfg = (& $appcmd list config "GCPE/$p" -section:system.webServer/httpLogging) -join "`n"
            Check "/$p is never logged (httpLogging dontLog)" ($cfg -match 'dontLog="true"')
          }
          $siteId = (& $appcmd list site GCPE /text:id)
          $logDir = "C:\inetpub\logs\LogFiles\W3SVC$siteId"
          curl.exe -k -s -o NUL 'https://localhost/subscribe/manage/?token=ci-secret-token-1'
          curl.exe -k -s -o NUL 'https://localhost/Subscribe/?token=ci-secret-token-2'
          curl.exe -k -s -o NUL 'https://localhost/api/Subscribe/CheckEmailActivationToken/ci-secret-token-3?api-version=1.0'
          curl.exe -k -s -o NUL 'https://localhost/nod/Subscribe/SubscriberInformation?emailAddress=ci-secret@example.test'
          curl.exe -k -s -o NUL -H 'Referer: https://localhost/subscribe/manage/?token=ci-secret-token-4' 'https://localhost/?ci-log-control=1'
          & netsh.exe http flush logbuffer | Out-Null
          Start-Sleep -Seconds 2
          $log = (Get-ChildItem "$logDir\*.log" | Get-Content) -join "`n"
          Check 'the control request is logged (logging works)' ($log -match 'ci-log-control=1')
          Check 'no subscribe URL, token or e-mail address in the IIS log' ($log -notmatch 'ci-secret')
          $fields = @(($log -split "`n") | Where-Object { $_ -like '#Fields:*' })[-1]
          Check "no Referer field ($fields)" ($fields -notmatch 'Referer')
          $task = 'GCPE IIS log cleanup (GCPE)'
          Check 'the log cleanup task exists' ([bool](Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue))
          Set-Content "$logDir\u_ex000101.log" 'old'
          (Get-Item "$logDir\u_ex000101.log").LastWriteTime = (Get-Date).AddDays(-40)
          Set-Content "$logDir\ci-fresh.log" 'fresh'
          $started = (Get-Date).AddSeconds(-2)
          Start-ScheduledTask -TaskName $task
          $deadline = (Get-Date).AddMinutes(3)
          do { Start-Sleep -Seconds 3; $t = Get-ScheduledTask -TaskName $task; $i = $t | Get-ScheduledTaskInfo } while (($t.State -eq 'Running' -or $i.LastRunTime -lt $started) -and (Get-Date) -lt $deadline)
          Check "the cleanup task ran (result $($i.LastTaskResult))" ($i.LastTaskResult -eq 0)
          Check 'a log older than 30 days is deleted' (-not (Test-Path "$logDir\u_ex000101.log"))
          Check 'a recent log is kept' (Test-Path "$logDir\ci-fresh.log")
          Remove-Item "$logDir\ci-fresh.log"
      # Windows Firewall never filters loopback, so the runner still reaches its own IIS; what is
      # checked is the rule set (no second machine here to be refused).
      - name: Install-Gcpe.ps1 again with -AllowedClientRanges (safe to re-run; deploys a second release)
        run: |
          function Check($label, $ok) { if (-not $ok) { throw "FAILED: $label" } else { Write-Host "ok: $label" } }
          C:\pkg\gcpe-windows\Install-Gcpe.ps1 -HostName gcpe-ci.example.test -AllowedClientRanges 192.0.2.0/24, 198.51.100.7/32
          if (@(Get-ChildItem C:\gcpe\releases -Directory).Count -ne 2) { throw 'expected two releases' }
          $rule = Get-NetFirewallRule -DisplayName 'GCPE web: allowed client ranges only' -ErrorAction SilentlyContinue
          Check 'the allow rule exists and is enabled' ($rule -and $rule.Enabled -eq 'True' -and $rule.Action -eq 'Allow')
          $remote = @(($rule | Get-NetFirewallAddressFilter).RemoteAddress)
          Write-Host "remote addresses: $($remote -join ', ')"
          Check 'it names exactly the two ranges' ($remote.Count -eq 2 -and ($remote -join ' ') -match '192\.0\.2\.0' -and ($remote -join ' ') -match '198\.51\.100\.7')
          $ports = @(($rule | Get-NetFirewallPortFilter).LocalPort)
          Check "it covers 443 and 80 ($($ports -join ', '))" ($ports -contains '443' -and $ports -contains '80')
          $iis = @(Get-NetFirewallRule -Name 'IIS-WebServerRole-HTTP*-In-TCP' -ErrorAction SilentlyContinue)
          Check "IIS's own web rules exist ($($iis.Count)) and are all off" ($iis.Count -gt 0 -and @($iis | Where-Object { $_.Enabled -eq 'True' }).Count -eq 0)
          Import-Module C:\pkg\gcpe-windows\lib\Gcpe.psm1 -Force
          $open = @(Get-GcpeInboundAllowRules -Ports @('443', '80') -ExceptDisplayName @('GCPE web: allowed client ranges only'))
          Check "no other rule opens 443 or 80, TCP or UDP ($(($open | ForEach-Object { $_.DisplayName }) -join ', '))" ($open.Count -eq 0)
          $health = curl.exe -k -sS -f https://localhost/stack/health | ConvertFrom-Json
          Check 'the site still answers on loopback' ($health.status -eq 'ok')
      - name: A release that never becomes healthy is rolled back
        run: |
          $before = (Get-Item C:\gcpe\current).Target
          Copy-Item -Recurse C:\pkg\gcpe-windows C:\pkg-broken
          Set-Content C:\pkg-broken\app\stack.js "if (process.argv.includes('--check')) process.exit(0); setInterval(() => {}, 1000);"
          $failed = $false
          try { C:\pkg-broken\Deploy-GcpeRelease.ps1 -Package C:\pkg-broken -HealthTimeoutSec 30 } catch { $failed = $true; Write-Host "deploy failed as expected: $_" }
          if (-not $failed) { throw 'the broken release was not refused' }
          if ((Get-Item C:\gcpe\current).Target -ne $before) { throw 'current was not rolled back' }
          $health = curl.exe -k -sS -f https://localhost/stack/health | ConvertFrom-Json
          if ($health.status -ne 'ok') { throw 'the site is not healthy after the rollback' }
          Write-Host 'ok: rolled back and healthy'
      - name: The firewall restriction is kept on a re-run and removed by -AllowAllClients
        run: |
          function Check($label, $ok) { if (-not $ok) { throw "FAILED: $label" } else { Write-Host "ok: $label" } }
          C:\pkg\gcpe-windows\Install-Gcpe.ps1 -HostName gcpe-ci.example.test
          Check 'a re-run without -AllowedClientRanges keeps it' ([bool](Get-NetFirewallRule -DisplayName 'GCPE web: allowed client ranges only' -ErrorAction SilentlyContinue))
          Check "IIS's own web rules stay off" (@(Get-NetFirewallRule -Name 'IIS-WebServerRole-HTTP*-In-TCP' | Where-Object { $_.Enabled -eq 'True' }).Count -eq 0)
          C:\pkg\gcpe-windows\Install-Gcpe.ps1 -HostName gcpe-ci.example.test -AllowAllClients
          Check '-AllowAllClients removes it' (-not (Get-NetFirewallRule -DisplayName 'GCPE web: allowed client ranges only' -ErrorAction SilentlyContinue))
          Check "and turns IIS's own web rules back on" (@(Get-NetFirewallRule -Name 'IIS-WebServerRole-HTTP*-In-TCP' | Where-Object { $_.Enabled -ne 'True' }).Count -eq 0)
      - name: Register-GcpeBackup.ps1 (nightly backup task, first run, retention, a dump restores)
        run: |
          $ErrorActionPreference = 'Stop'
          function Check($label, $ok) { if (-not $ok) { throw "FAILED: $label" } else { Write-Host "ok: $label" } }
          New-Item -ItemType Directory -Force C:\gcpe\data\storage | Out-Null
          Set-Content C:\gcpe\data\storage\ci-backup-probe.txt 'probe'
          $machine = "C:\gcpe-backups\$env:COMPUTERNAME"
          New-Item -ItemType Directory -Force "$machine\20000101-000000", "$machine\keep-me" | Out-Null
          Set-Content "$machine\20000101-000000\COMPLETE.txt" 'old'
          C:\pkg\gcpe-windows\Register-GcpeBackup.ps1 -BackupPath C:\gcpe-backups -WaitMinutes 20
          $info = Get-ScheduledTask -TaskName 'GCPE nightly backup' | Get-ScheduledTaskInfo
          Check "the task ran as SYSTEM and succeeded (result $($info.LastTaskResult))" ($info.LastTaskResult -eq 0)
          $run = Get-ChildItem $machine -Directory | Where-Object { $_.Name -match '^\d{8}-\d{6}$' } | Sort-Object Name -Descending | Select-Object -First 1
          Write-Host "backup: $($run.FullName)"
          Get-ChildItem $run.FullName -Recurse | ForEach-Object { Write-Host "  $($_.FullName.Substring($run.FullName.Length)) $(if (-not $_.PSIsContainer) { $_.Length })" }
          $dumps = @(Get-ChildItem "$($run.FullName)\db\gcpe_*.dump")
          Check "one dump per database ($($dumps.Count))" ($dumps.Count -eq 7)
          Check 'the run is marked complete' (Test-Path "$($run.FullName)\COMPLETE.txt")
          Check 'release files copied' (Test-Path "$($run.FullName)\files\storage\ci-backup-probe.txt")
          Check 'settings copied' (Test-Path "$($run.FullName)\config\gcpe.env")
          Check 'a backup older than 14 days is deleted' (-not (Test-Path "$machine\20000101-000000"))
          Check 'a folder the script did not make is kept' (Test-Path "$machine\keep-me")
          foreach ($dir in @($machine, $run.FullName)) {
            $acl = Get-Acl -LiteralPath $dir
            $who = @($acl.Access | ForEach-Object { $_.IdentityReference.Value } | Sort-Object -Unique)
            Check "$dir inherits nothing ($($acl.AreAccessRulesProtected))" ($acl.AreAccessRulesProtected)
            Check "$dir is for Administrators and SYSTEM only ($($who -join ', '))" (($who -join ',') -eq 'BUILTIN\Administrators,NT AUTHORITY\SYSTEM')
          }
          $envAcl = Get-Acl -LiteralPath "$($run.FullName)\config\gcpe.env"
          Check "the copied gcpe.env is Administrators and SYSTEM only ($(@($envAcl.Access | ForEach-Object { $_.IdentityReference.Value }) -join ', '))" (@($envAcl.Access | Where-Object { @('BUILTIN\Administrators', 'NT AUTHORITY\SYSTEM') -notcontains $_.IdentityReference.Value }).Count -eq 0)
          # The dump restores: into a scratch database, as the restore runbook does.
          $bin = "$env:ProgramFiles\PostgreSQL\17\bin"
          $env:PGPASSWORD = (Get-Content -Raw C:\gcpe\config\postgres-superuser.txt).Trim()
          function Run([string]$exe, [string[]]$argv) {
            $p = Start-Process -FilePath "$bin\$exe" -ArgumentList $argv -Wait -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\out.txt" -RedirectStandardError "$env:RUNNER_TEMP\err.txt"
            Get-Content "$env:RUNNER_TEMP\err.txt" | ForEach-Object { Write-Host "  $($exe): $_" }
            [pscustomobject]@{ Code = $p.ExitCode; Out = (Get-Content -Raw "$env:RUNNER_TEMP\out.txt") }
          }
          $core = ($dumps | Where-Object { $_.Name -eq 'gcpe_core.dump' }).FullName
          Check 'createdb' ((Run 'createdb.exe' @('-h', 'localhost', '-U', 'postgres', 'gcpe_restore_check')).Code -eq 0)
          Check 'pg_restore of gcpe_core' ((Run 'pg_restore.exe' @('-h', 'localhost', '-U', 'postgres', '-d', 'gcpe_restore_check', '--no-owner', '--exit-on-error', "`"$core`"")).Code -eq 0)
          $tables = (Run 'psql.exe' @('-h', 'localhost', '-U', 'postgres', '-d', 'gcpe_restore_check', '-At', '-c', '"SELECT count(*) FROM pg_tables WHERE schemaname NOT IN (''pg_catalog'', ''information_schema'')"')).Out.Trim()
          Check "the restored database has tables ($tables)" ([int]$tables -gt 0)
          Run 'dropdb.exe' @('-h', 'localhost', '-U', 'postgres', 'gcpe_restore_check') | Out-Null
      - name: The importers load and reach for SQL Server
        run: |
          $sqlpw = ConvertTo-SecureString 'not-a-real-password' -AsPlainText -Force
          $adminpw = ConvertTo-SecureString 'ci-admin-password-0001' -AsPlainText -Force
          $failed = $false
          try { C:\pkg\gcpe-windows\Import-GcpeLegacy.ps1 -SqlServer 127.0.0.1 -SqlUser nobody -SqlPassword $sqlpw -AdminPassword $adminpw -Only Core } catch { $failed = $true; Write-Host "$_" }
          if (-not $failed) { throw 'expected the Core import to fail: there is no SQL Server here' }
          $log = Get-Content (Get-ChildItem C:\gcpe\import-reports\*\core.log | Select-Object -First 1).FullName -Raw
          Write-Host $log
          if ($log -notmatch 'ESOCKET|ECONNREFUSED|Failed to connect') { throw 'the Core importer failed for some reason other than reaching SQL Server' }
          Write-Host 'ok: the bundled importer started and tried to connect'
          # The step's result would otherwise be the importer's expected exit code 1.
          exit 0
      # The DMZ reverse proxy (docs/deploy/windows.md, 8 "DMZ proxy reference"), as a second IIS site on
      # this runner in front of the install above: its own host name and ports, the app's
      # self-signed certificate trusted by thumbprint. Every request uses the proxy's host name,
      # which is NOT on the app's certificate, as in Test/Prod (public name != app server name).
      - name: Install-GcpeProxy.ps1 (a DMZ proxy in front of this install)
        run: |
          $appCert = Get-ChildItem Cert:\LocalMachine\My | Where-Object { $_.FriendlyName -eq 'GCPE self-signed (gcpe-ci.example.test)' } | Select-Object -First 1
          if (-not $appCert) { throw 'the app install''s self-signed certificate is missing' }
          C:\pkg-proxy\gcpe-proxy\Install-GcpeProxy.ps1 -HostName gcpe-proxy-ci.example.test -Upstream https://localhost -UpstreamCertificateThumbprint $appCert.Thumbprint -HttpsPort 8443 -HttpPort 8080 -Environment Test
          # Safe to re-run.
          C:\pkg-proxy\gcpe-proxy\Install-GcpeProxy.ps1 -HostName gcpe-proxy-ci.example.test -Upstream https://localhost -HttpsPort 8443 -HttpPort 8080
      - name: The proxy forwards only the public paths
        run: |
          $ErrorActionPreference = 'Stop'
          function Check($label, $ok) { if (-not $ok) { throw "FAILED: $label" } else { Write-Host "ok: $label" } }
          $h = 'gcpe-proxy-ci.example.test'
          $base = "https://$($h):8443"
          $res = @('--resolve', "$($h):8443:127.0.0.1", '--resolve', "$($h):8080:127.0.0.1")
          function Status([string]$path, [string]$method = 'GET') { $len = if ($method -ne 'GET' -and $method -ne 'HEAD') { @('-H', 'Content-Length: 0') } else { @() }; curl.exe -k -s --path-as-is --max-time 30 @res @len -X $method -o NUL -w '%{http_code}' "$base$path" }
          # The site is built by the app's background ticks: wait until the app itself serves / and a feed.
          $deadline = (Get-Date).AddSeconds(300)
          while ((curl.exe -k -s -o NUL -w '%{http_code}' https://localhost/) -ne '200' -or (curl.exe -k -s -o NUL -w '%{http_code}' https://localhost/feed) -ne '200') {
            if ((Get-Date) -gt $deadline) { throw 'the app never served / and /feed directly (not a proxy problem)' }
            Start-Sleep -Seconds 5
          }
          Check "public home page through the proxy" ((Status '/') -eq '200')
          Check "feed through the proxy" ((Status '/feed') -eq '200')
          Check "public News API through the proxy" ((Status '/api/v2/ministries') -eq '200')
          Check "robots.txt through the proxy (test site: Disallow /)" ((curl.exe -k -s @res "$base/robots.txt") -match 'Disallow: /\s*$')
          foreach ($p in @('/hub/', '/hub/assets/x.js', '/HUB/', '/stack/health', '/stack/errors', '/core/api/organizations', '/core/auth/login', '/nrms/health/ready', '/nod/Subscribe/SubscriberInformation?emailAddress=a@example.test', '/calendar/', '/distribution/', '/site-builder/', '/events', '/health/ready', '/api/v2/changes', '/api/v2/internal/similar', '/fake-entra/')) {
            $s = Status $p
            Check "$p is 404 at the proxy (HTTP $s)" ($s -eq '404')
          }
          # Sent as they are (--path-as-is): IIS may refuse these itself (400) before the proxy's rule (404).
          foreach ($p in @('/hub/../hub/', '/releases/../hub/', '/files/..%2fhub/', '/%68ub/')) {
            $s = Status $p
            Check "$p never reaches the app (HTTP $s)" ($s -eq '404' -or $s -eq '400')
          }
          $s = Status '/stack/tick' 'POST'; Check "POST /stack/tick is 404 (HTTP $s)" ($s -eq '404')
          $s = Status '/core/auth/login' 'POST'; Check "POST /core/auth/login is 404 (HTTP $s)" ($s -eq '404')
          $s = Status '/updates/negotiate' 'POST'; Check "POST /updates/negotiate is 404 (live-updates hub not public) (HTTP $s)" ($s -eq '404')
          $s = Status '/api/Posts' 'PUT'; Check "PUT under /api is 404 (HTTP $s)" ($s -eq '404')
          $headers = (curl.exe -k -s @res -D - -o NUL "$base/") -join "`n"
          Check "X-Robots-Tag: noindex at the proxy" ($headers -match '(?im)^x-robots-tag:\s*noindex, nofollow')
          $old = curl.exe -k -s @res -o NUL -w '%{http_code} %{redirect_url}' "$base/contact"
          Check "an old news.gov address redirects ($old)" ($old -eq '301 https://forms.gov.bc.ca/')
          $site = curl.exe -k -s @res -o NUL -w '%{http_code} %{redirect_url}' "$base/site/archive/"
          Check "/site/... redirects to the root ($site)" ($site -like '301 */archive/')
          $redirect = curl.exe -s @res -o NUL -w '%{http_code} %{redirect_url}' "http://$($h):8080/archive/"
          Check "http redirects to https ($redirect)" ($redirect -eq "301 $base/archive/")
      - name: DIAG cache matrix
        continue-on-error: true
        run: |
          $h = 'gcpe-proxy-ci.example.test'
          $base = "https://$($h):8443"
          $res = @('--resolve', "$($h):8443:127.0.0.1")
          $appcmd = "$env:windir\System32\inetsrv\appcmd.exe"
          $proxyId = (& $appcmd list site GCPE-Proxy /text:id)
          function One([string]$path, [string]$enc) {
            $a = @('-k', '-s', '-D', '-', '-o', 'NUL') + $res
            if ($enc) { $a += @('-H', "Accept-Encoding: $enc") }
            $out = (& curl.exe @a "$base$path") -join "`n"
            $ce = [regex]::Match($out, '(?im)^content-encoding:\s*(\S+)').Groups[1].Value
            $len = [regex]::Match($out, '(?im)^content-length:\s*(\S+)').Groups[1].Value
            $cc = [regex]::Match($out, '(?im)^cache-control:\s*(.+)$').Groups[1].Value.Trim()
            Write-Host ("    {0,-8} {1,-20} -> CE={2,-5} len={3,-6} cc={4}" -f (Get-Date -Format 'ss.fff'), "'$enc'", $ce, $len, $cc)
          }
          function Seq([string]$path, [object[]]$steps) {
            Write-Host "  -- $path"
            foreach ($s in $steps) { if ($s -is [int]) { Start-Sleep -Seconds $s } else { One $path $s } }
          }
          function Hits([string]$path) {
            & netsh.exe http flush logbuffer | Out-Null
            Start-Sleep -Seconds 3
            $l = @(Get-ChildItem "C:\inetpub\logs\LogFiles\W3SVC$proxyId\*.log" | Get-Content | Where-Object { $_ -match " GET $([regex]::Escape($path)) " })
            Write-Host "  proxy log for $($path): $($l.Count) lines, hits: $(@($l | Where-Object { $_ -match 'X-ARR-CACHE-HIT=1' }).Count)"
            Write-Host '  cache folder:'
            Get-ChildItem C:\gcpe-proxy\cache -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "    $($_.FullName) $($_.Length)" }
          }
          function Reset([string]$ae) {
            & $appcmd set config -section:system.webServer/diskCache "/allowedAcceptEncoding:$ae" /commit:apphost | Out-Null
            & $appcmd recycle apppool GCPE-Proxy | Out-Null
            Start-Sleep -Seconds 2
            Get-ChildItem C:\gcpe-proxy\cache -Recurse -File -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          }
          $wc = 'C:\gcpe-proxy\site\web.config'
          $orig = Get-Content -Raw $wc
          Write-Host '=== P1 upstream https://localhost (as installed), allowedAcceptEncoding=gzip'
          Reset 'gzip'
          Seq '/live/' @('', 8, '', '', 'gzip', 'br')
          Hits '/live/'
          Write-Host '=== P2 upstream http://127.0.0.1:3000 (node, plain http), allowedAcceptEncoding=gzip'
          [IO.File]::WriteAllText($wc, $orig.Replace('https://localhost{UNENCODED_URL}', 'http://127.0.0.1:3000{UNENCODED_URL}'))
          Reset 'gzip'
          Seq '/ministries/' @('', 8, '', 'br', 'gzip', '', 'gzip, deflate, br', 8, 'br', 'gzip', '')
          Hits '/ministries/'
          Seq '/search/' @('br', 8, 'br', '', 'gzip', 'gzip, deflate, br', 8, '', 'br', 'gzip')
          Hits '/search/'
          Write-Host '=== P3 upstream http, allowedAcceptEncoding=gzip,br'
          Reset 'gzip,br'
          Seq '/connect/' @('', 8, '', 'br', 'gzip', '', 'gzip, deflate, br', 8, 'br', 'gzip', '')
          Hits '/connect/'
          Seq '/live/' @('br', 8, 'br', '', 'gzip', 'gzip, deflate, br', 8, '', 'br', 'gzip')
          Write-Host '=== P4 upstream https://localhost, allowedAcceptEncoding=gzip,br'
          [IO.File]::WriteAllText($wc, $orig)
          Reset 'gzip,br'
          Seq '/archive/' @('', 8, '', 'br', 'gzip', 8, 'br', '')
          Hits '/archive/'
          Reset 'gzip'
      - name: The proxy caches public pages only, per encoding
        run: |
          $ErrorActionPreference = 'Stop'
          function Check($label, $ok) { if (-not $ok) { throw "FAILED: $label" } else { Write-Host "ok: $label" } }
          $h = 'gcpe-proxy-ci.example.test'
          $base = "https://$($h):8443"
          $res = @('--resolve', "$($h):8443:127.0.0.1")
          $appcmd = "$env:windir\System32\inetsrv\appcmd.exe"
          $appSite = (& $appcmd list site GCPE /text:id)
          $proxySite = (& $appcmd list site GCPE-Proxy /text:id)
          function LogLines([string]$site) {
            & netsh.exe http flush logbuffer | Out-Null
            Start-Sleep -Seconds 2
            @(Get-ChildItem "C:\inetpub\logs\LogFiles\W3SVC$site\*.log" -ErrorAction SilentlyContinue | Get-Content | Where-Object { $_ -notmatch '^#' })
          }
          # How many requests a site logged for one path (W3C field 4 is cs-uri-stem, 5 cs-uri-query).
          # A request the proxy answers from its cache never reaches the app server's site (GCPE).
          function Logged([string]$site, [string]$stem, [string]$queryPrefix = '') {
            @(LogLines $site | Where-Object { $f = $_ -split ' '; $f[4] -eq $stem -and ($queryPrefix -eq '' -or $f[5].StartsWith($queryPrefix)) }).Count
          }
          function Fetch([string]$path, [string]$encoding) {
            $curlArgs = @('-k', '-s') + $res + @('-D', '-', '-o', 'NUL')
            if ($encoding) { $curlArgs += @('-H', "Accept-Encoding: $encoding") }
            $out = (curl.exe @curlArgs "$base$path") -join "`n"
            [pscustomobject]@{ Status = [regex]::Match($out, '^HTTP/\S+ (\d+)').Groups[1].Value; Encoding = [regex]::Match($out, '(?im)^content-encoding:\s*(\S+)').Groups[1].Value }
          }
          # http.sys's own memory cache lasts 5 s: the waits below go past it, inside the page's max-age=60.
          $first = Fetch '/' 'br'
          Check "first / (br) is 200 and br-encoded ($($first.Status) '$($first.Encoding)')" ($first.Status -eq '200' -and $first.Encoding -eq 'br')
          Start-Sleep -Seconds 7
          $before = Logged $appSite '/'
          $second = Fetch '/' 'br'
          Check "second / (br) is 200 and br-encoded ($($second.Status) '$($second.Encoding)')" ($second.Status -eq '200' -and $second.Encoding -eq 'br')
          $reached = (Logged $appSite '/') - $before
          $hits = @(LogLines $proxySite | Where-Object { $_ -match ' GET / X-ARR-CACHE-HIT=1' }).Count
          Check "the second / came from the proxy's cache (reached the app server: $reached; X-ARR-CACHE-HIT=1 lines for /: $hits)" ($reached -eq 0 -or $hits -gt 0)
          $gzip = Fetch '/' 'gzip'
          Check "a gzip-only client never gets br ($($gzip.Status) '$($gzip.Encoding)')" ($gzip.Status -eq '200' -and ($gzip.Encoding -eq 'gzip' -or $gzip.Encoding -eq ''))
          $plain = Fetch '/' ''
          Check "a client without Accept-Encoding gets an unencoded body ($($plain.Status) '$($plain.Encoding)')" ($plain.Status -eq '200' -and $plain.Encoding -eq '')
          # Never cached: the API and anything with a query string (counted in the app server's log).
          # The subscribe pages are never logged at all, so for them the cache-folder check below decides.
          foreach ($t in @(@('/api/v2/ministries', '', ''), @('/', 'ci=1', '?ci=1'))) {
            $before = Logged $appSite $t[0] $t[1]
            Fetch "$($t[0])$($t[2])" 'gzip' | Out-Null
            Start-Sleep -Seconds 7
            Fetch "$($t[0])$($t[2])" 'gzip' | Out-Null
            $seen = (Logged $appSite $t[0] $t[1]) - $before
            Check "$($t[0])$($t[2]) is never cached: both requests reached the app server ($seen)" ($seen -eq 2)
          }
          $before = Logged $appSite '/hub/'
          Check "/hub/ is 404 twice at the proxy" (((Fetch '/hub/' 'gzip').Status -eq '404') -and ((Fetch '/hub/' 'gzip').Status -eq '404'))
          Check "/hub/ never reached the app server" ((Logged $appSite '/hub/') -eq $before)
          $files = @(Get-ChildItem C:\gcpe-proxy\cache -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          $files | ForEach-Object { Write-Host "  cached: $_" }
          Check "the cache folder holds something ($($files.Count) files)" ($files.Count -gt 0)
          Check "nothing staff, API or subscribe in the cache folder" (@($files | Where-Object { $_ -match '\\(hub|core|nrms|nod|stack|api|subscribe)(\\|\.|$)' }).Count -eq 0)
      - name: The proxy never logs subscribe URLs
        run: |
          $ErrorActionPreference = 'Stop'
          function Check($label, $ok) { if (-not $ok) { throw "FAILED: $label" } else { Write-Host "ok: $label" } }
          $h = 'gcpe-proxy-ci.example.test'
          $base = "https://$($h):8443"
          $res = @('--resolve', "$($h):8443:127.0.0.1")
          $appcmd = "$env:windir\System32\inetsrv\appcmd.exe"
          foreach ($p in @('api/Subscribe', 'subscribe', 'news-subscribe', 'newsletters', 'enewsletters')) {
            $cfg = (& $appcmd list config "GCPE-Proxy/$p" -section:system.webServer/httpLogging) -join "`n"
            Check "/$p is never logged at the proxy" ($cfg -match 'dontLog="true"')
          }
          curl.exe -k -s @res -o NUL "$base/subscribe/manage/?token=ci-proxy-secret-1"
          curl.exe -k -s @res -o NUL "$base/api/Subscribe/CheckEmailActivationToken/ci-proxy-secret-2?api-version=1.0"
          curl.exe -k -s @res -o NUL -H 'Referer: https://x/subscribe/?token=ci-proxy-secret-3' "$base/?ci-proxy-control=1"
          & netsh.exe http flush logbuffer | Out-Null
          Start-Sleep -Seconds 2
          $proxyLog = (Get-ChildItem "C:\inetpub\logs\LogFiles\W3SVC$(& $appcmd list site GCPE-Proxy /text:id)\*.log" | Get-Content) -join "`n"
          $appLog = (Get-ChildItem "C:\inetpub\logs\LogFiles\W3SVC$(& $appcmd list site GCPE /text:id)\*.log" | Get-Content) -join "`n"
          Check 'the control request is logged at the proxy' ($proxyLog -match 'ci-proxy-control=1')
          Check 'no subscribe token in the proxy log' ($proxyLog -notmatch 'ci-proxy-secret')
          Check 'no subscribe token in the app server log' ($appLog -notmatch 'ci-proxy-secret')
          Check 'the proxy log cleanup task exists' ([bool](Get-ScheduledTask -TaskName 'GCPE IIS log cleanup (GCPE-Proxy)' -ErrorAction SilentlyContinue))
      - name: The proxy's client address restriction
        run: |
          $ErrorActionPreference = 'Stop'
          function Check($label, $ok) { if (-not $ok) { throw "FAILED: $label" } else { Write-Host "ok: $label" } }
          $h = 'gcpe-proxy-ci.example.test'
          $res = @('--resolve', "$($h):8443:127.0.0.1")
          C:\pkg-proxy\gcpe-proxy\Install-GcpeProxy.ps1 -HostName $h -Upstream https://localhost -HttpsPort 8443 -HttpPort 8080 -AllowedClientRanges 192.0.2.0/24
          $s = curl.exe -k -s @res -o NUL -w '%{http_code}' "https://$($h):8443/"
          Check "a client outside the ranges gets 403 (HTTP $s)" ($s -eq '403')
          C:\pkg-proxy\gcpe-proxy\Install-GcpeProxy.ps1 -HostName $h -Upstream https://localhost -HttpsPort 8443 -HttpPort 8080
          $s = curl.exe -k -s @res -o NUL -w '%{http_code}' "https://$($h):8443/"
          Check "a re-run without -AllowedClientRanges keeps the restriction (HTTP $s)" ($s -eq '403')
          C:\pkg-proxy\gcpe-proxy\Install-GcpeProxy.ps1 -HostName $h -Upstream https://localhost -HttpsPort 8443 -HttpPort 8080 -AllowedClientRanges 127.0.0.0/8
          $s = curl.exe -k -s @res -o NUL -w '%{http_code}' "https://$($h):8443/"
          Check "a client inside the ranges gets the site (HTTP $s)" ($s -eq '200')
          C:\pkg-proxy\gcpe-proxy\Install-GcpeProxy.ps1 -HostName $h -Upstream https://localhost -HttpsPort 8443 -HttpPort 8080 -AllowAllClients
          $s = curl.exe -k -s @res -o NUL -w '%{http_code}' "https://$($h):8443/"
          Check "-AllowAllClients removes it (HTTP $s)" ($s -eq '200')
      - name: The proxy keeps -Environment on a re-run
        run: |
          $ErrorActionPreference = 'Stop'
          function Check($label, $ok) { if (-not $ok) { throw "FAILED: $label" } else { Write-Host "ok: $label" } }
          $h = 'gcpe-proxy-ci.example.test'
          $res = @('--resolve', "$($h):8443:127.0.0.1")
          function Robots { ((curl.exe -k -s @res -D - -o NUL "https://$($h):8443/") -join "`n") -match '(?im)^x-robots-tag:' }
          C:\pkg-proxy\gcpe-proxy\Install-GcpeProxy.ps1 -HostName $h -Upstream https://localhost -Environment Prod -CacheMaxSizeGB 3
          Check 'Prod: no X-Robots-Tag' (-not (Robots))
          C:\pkg-proxy\gcpe-proxy\Install-GcpeProxy.ps1 -HostName $h -Upstream https://localhost
          Check 'a re-run without -Environment stays Prod (no X-Robots-Tag)' (-not (Robots))
          $state = Get-Content -Raw C:\gcpe-proxy\proxy-settings.json | ConvertFrom-Json
          Check "the saved settings ($($state | ConvertTo-Json -Compress))" ($state.Environment -eq 'Prod' -and $state.CacheMaxSizeGB -eq 3 -and $state.HttpsPort -eq 8443 -and $state.HttpPort -eq 8080)
          Check 'the ports were kept too (the site still answers on 8443)' ((curl.exe -k -s @res -o NUL -w '%{http_code}' "https://$($h):8443/") -eq '200')
          Check 'the replaced rules were kept for a rollback' (@(Get-ChildItem C:\gcpe-proxy\logs\web.config.*.bak).Count -gt 0)
          C:\pkg-proxy\gcpe-proxy\Install-GcpeProxy.ps1 -HostName $h -Upstream https://localhost -Environment Test
          Check '-Environment Test turns noindex back on' (Robots)
      - name: Logs
        if: always()
        run: |
          Get-ChildItem C:\gcpe-proxy\logs -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "=== $($_.Name)"; Get-Content $_.FullName -Tail 120 }
          if (Test-Path C:\gcpe-proxy\site\web.config) { Write-Host '=== proxy web.config'; Get-Content C:\gcpe-proxy\site\web.config }
          & netsh.exe http flush logbuffer | Out-Null
          Get-ChildItem C:\inetpub\logs\LogFiles\W3SVC* -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "=== $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
          Get-ChildItem C:\gcpe\service\logs -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "=== $($_.Name)"; Get-Content $_.FullName -Tail 80 }
          Get-ChildItem C:\gcpe\logs -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "=== $($_.Name)"; Get-Content $_.FullName -Tail 120 }
