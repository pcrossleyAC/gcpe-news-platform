name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build Core bundle
        run: npm --workspace @gcpe/core run build
      - name: Build Core image
        run: docker build -f apps/core/Dockerfile -t gcpe-core:ci .
      - name: Build News API bundle
        run: npm --workspace @gcpe/news-api run build
      - name: Build News API image
        run: docker build -f apps/news-api/Dockerfile -t gcpe-news-api:ci .
      - name: Build NRMS bundle
        run: npm --workspace @gcpe/nrms run build
      - name: Build NRMS image
        run: docker build -f apps/nrms/Dockerfile -t gcpe-nrms:ci .
      - name: Build Public Site bundle
        run: npm --workspace @gcpe/public-site run build
      - name: Build Public Site image
        run: docker build -f apps/public-site/Dockerfile -t gcpe-public-site:ci .
      - name: Build NoD bundle
        run: npm --workspace @gcpe/nod run build
      - name: Build NoD image
        run: docker build -f apps/nod/Dockerfile -t gcpe-nod:ci .
      - name: Build Distribution bundle
        run: npm --workspace @gcpe/distribution run build
      - name: Build Distribution image
        run: docker build -f apps/distribution/Dockerfile -t gcpe-distribution:ci .
