name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the manuals check compares this branch with the base branch
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Manuals are up to date with the screens
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-manuals-current.mjs --base "origin/$BASE_REF"
      - run: npm run check
      - run: npm test
      - name: Build Core bundle
        run: npm --workspace @gcpe/core run build
      - name: Build News API bundle
        run: npm --workspace @gcpe/news-api run build
      - name: Build NRMS bundle
        run: npm --workspace @gcpe/nrms run build
      - name: Build Public Site bundle
        run: npm --workspace @gcpe/public-site run build
      - name: Build NoD bundle
        run: npm --workspace @gcpe/nod run build
      - name: Build Distribution bundle
        run: npm --workspace @gcpe/distribution run build
  # Phase 6 exit (spec §9): axe and Lighthouse on a fictional fixture site. Separate from `test`
  # so a browser problem never hides unit-test results; not a required check until it has run
  # green here (Q87).
  site-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run site:quality
  # The Playwright end-to-end suite (staff screens, axe sweep, journeys) against the whole stack.
  # global-setup.ts creates its own test databases on this Postgres, starts every app, builds
  # staff-web and picks free ports; workers is 1 because every spec shares that one stack.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
